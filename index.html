<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Notebook1 — Записник</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        background: #111;
        color: white;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    #reader {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        touch-action: pan-y;
    }

    #page {
        max-width: 100%;
        max-height: calc(100vh - 60px);
        object-fit: contain;
        user-select: none;
        transition: transform 0.25s ease;
    }

    button {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        width: 55px;
        height: 80px;
        border: none;
        border-radius: 12px;
        background: rgba(255,255,255,0.12);
        color: white;
        font-size: 35px;
        cursor: pointer;
        z-index: 10;
    }

    #prev {
        left: 10px;
    }

    #next {
        right: 10px;
    }

    #counter {
        position: fixed;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.6);
        padding: 6px 12px;
        border-radius: 10px;
        font-size: 14px;
        z-index: 10;
    }
</style>
</head>

<body>

<div id="reader">

    <img id="page" src="Untitled831_20260918215013.jpg" alt="Сторінка">

    <button id="prev">‹</button>
    <button id="next">›</button>

    <div id="counter">1 / 1</div>

</div>

<script>

const pages = [
    "Untitled831_20260918215013.jpg",

    // ДОДАВАЙ НОВІ СТОРІНКИ СЮДИ:
    "page_20260928182229.png",
    "page_20260928184726.png",
   "page_20260928185421.png",
    "page_20260929010144.png",
   "page_20260929011030.png",
   "page_20260929014814.png",
   "page_20260929164055.png",
    "page_20261001000405.png",
   "page_20261002004259.png",
   "page_20261002194909.png",
   "page_20261003144223.png",
   "page_20261005004554.png",
   "page_20261005183511.png",
   "page_20261005201431.png",
   "page_20261005201439.png",
   "page_20261005232917.png",
   "page_20261005232928.png",
   "page_20261005232935.png",
   "page_20261005232942.png",
   "page_20261005233125.png",
];

let currentPage = 0;

const image = document.getElementById("page");
const counter = document.getElementById("counter");

function showPage(number) {

    if (number < 0 || number >= pages.length) return;

    currentPage = number;

    image.src = pages[currentPage];

    counter.textContent =
        (currentPage + 1) + " / " + pages.length;
}

function nextPage() {
    showPage(currentPage + 1);
}

function previousPage() {
    showPage(currentPage - 1);
}

document.getElementById("next").onclick = nextPage;
document.getElementById("prev").onclick = previousPage;


// Свайп пальцем

let startX = 0;

document.addEventListener("touchstart", function(event) {
    startX = event.touches[0].clientX;
});

document.addEventListener("touchend", function(event) {

    const endX = event.changedTouches[0].clientX;
    const difference = endX - startX;

    if (Math.abs(difference) < 50) return;

    // Свайп справа наліво → наступна сторінка
    if (difference < 0) {
        nextPage();
    }

    // Свайп зліва направо → попередня
    else {
        previousPage();
    }
});

showPage(0);

</script>

</body>
</html>
